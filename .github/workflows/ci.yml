name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Zero erros desde a Fase 3 — o eslint-suppressions.json que congelava
      # os 53 erros originais foi removido por não ter mais o que suprimir.
      - name: Lint
        run: npx eslint .

      - name: Typecheck (app)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck (node)
        run: npx tsc -p tsconfig.node.json --noEmit

      - name: Testes (com limiar de cobertura)
        run: npm run test:coverage

      # Valores fictícios: o build só precisa que as variáveis existam.
      # Assim o job não depende do .env versionado.
      - name: Build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
          VITE_SUPABASE_PROJECT_ID: ci
        run: npm run build

  schema:
    name: Migrations · Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # O runner do GitHub já traz PostgreSQL instalado (parado por padrão).
      # O script sobe uma instância própria e efêmera, então não precisa de
      # service container.
      - name: Aplicar migrations e rodar testes de schema
        run: ./scripts/test-migrations.sh

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      # O próprio config sobe o app com `vite preview` sobre um build real,
      # usando credenciais fictícias do Supabase.
      - name: Testes end-to-end
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
